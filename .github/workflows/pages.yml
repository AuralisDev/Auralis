name: Build and deploy Auralis Website

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize public server directory
        if: ${{ vars.AURALIS_API_BASE != '' }}
        env:
          AURALIS_API_BASE: ${{ vars.AURALIS_API_BASE }}
        run: node Website/scripts/sync-public-servers.mjs

      - name: Validate required website pages and local links
        run: node Website/build.mjs --check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build and verify static website
        run: node Website/build.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
